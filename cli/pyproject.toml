[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "flowguard"
version = "1.0.0"
description = "FlowGuard CLI — AI Engineering Delivery Platform"
requires-python = ">=3.11"
dependencies = [
    "typer[all]>=0.9.0",
    "rich>=13.7.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.1",
]

[project.scripts]
flowguard = "flowguard.main:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["flowguard*"]
