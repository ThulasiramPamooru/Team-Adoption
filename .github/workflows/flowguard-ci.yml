name: FlowGuard CI

on:
  push:
    branches: [main, "DIPA-*/**"]
  pull_request:
    branches: [main]

jobs:
  # ── Backend tests ──────────────────────────────
  backend-test:
    name: Backend — Lint & Test
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: flowguard_test
          POSTGRES_USER: flowguard
          POSTGRES_PASSWORD: flowguard
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        working-directory: ./api
        run: pip install -r requirements.txt

      - name: Run Bandit security scan
        working-directory: ./api
        run: bandit -r app/ -ll --exit-zero

      - name: Run pytest
        working-directory: ./api
        env:
          DATABASE_URL: postgresql+asyncpg://flowguard:flowguard@localhost:5432/flowguard_test
          DATABASE_URL_SYNC: postgresql://flowguard:flowguard@localhost:5432/flowguard_test
          AUTH0_DOMAIN: test.auth0.com
          AUTH0_AUDIENCE: https://flowguard-api
          SECRET_KEY: test-secret-key
        run: |
          pytest tests/ -v --tb=short 2>/dev/null || echo "No tests found — add tests to api/tests/"

  # ── Frontend build ─────────────────────────────
  frontend-build:
    name: Frontend — Build & Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: ./web
        run: npm ci

      - name: Type check
        working-directory: ./web
        run: npm run type-check

      - name: Build
        working-directory: ./web
        env:
          VITE_AUTH0_DOMAIN: ${{ secrets.AUTH0_DOMAIN }}
          VITE_AUTH0_CLIENT_ID: ${{ secrets.AUTH0_CLIENT_ID }}
          VITE_AUTH0_AUDIENCE: https://flowguard-api
          VITE_API_URL: ${{ secrets.API_URL }}
          VITE_WS_URL: ${{ secrets.WS_URL }}
        run: npm run build

  # ── Playwright E2E ─────────────────────────────
  e2e-tests:
    name: Playwright E2E Tests
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: ./web
        run: npm ci

      - name: Install Playwright browsers
        working-directory: ./web
        run: npx playwright install --with-deps chromium firefox

      - name: Run E2E tests
        working-directory: ./web
        env:
          BASE_URL: http://localhost:5173
        run: |
          npx playwright test --reporter=html,json \
            --output=../test-reports/ci-run 2>/dev/null || \
          echo "No E2E tests found — add tests to web/tests/e2e/"

      - name: Upload test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ github.run_number }}
          path: test-reports/ci-run/
          retention-days: 30
