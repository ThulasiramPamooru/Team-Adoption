services:
  - type: web
    name: flowguard-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: flowguard-db
          property: connectionString
      - key: AUTH0_DOMAIN
        sync: false
      - key: AUTH0_AUDIENCE
        value: https://flowguard-api
      - key: GITHUB_TOKEN
        sync: false
      - key: JIRA_URL
        value: https://dolcera.atlassian.net
      - key: JIRA_EMAIL
        sync: false
      - key: JIRA_API_TOKEN
        sync: false
      - key: JIRA_PROJECT_KEY
        value: DIPA
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_ORIGINS
        sync: false

databases:
  - name: flowguard-db
    plan: free
    databaseName: flowguard
    user: flowguard
