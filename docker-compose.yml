version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: flowguard-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: flowguard
      POSTGRES_USER: flowguard
      POSTGRES_PASSWORD: flowguard
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flowguard"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: flowguard-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://flowguard:flowguard@postgres:5432/flowguard
      DATABASE_URL_SYNC: postgresql://flowguard:flowguard@postgres:5432/flowguard
    volumes:
      - ./api:/app
      - ./JIRA issues:/app/jira_issues
      - ./test-reports:/app/test_reports
    depends_on:
      postgres:
        condition: service_healthy
    command: uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  web:
    build:
      context: ./web
      dockerfile: Dockerfile.dev
    container_name: flowguard-web
    restart: unless-stopped
    ports:
      - "5173:5173"
    env_file:
      - .env
    volumes:
      - ./web:/app
      - /app/node_modules
    depends_on:
      - api
    command: npm run dev -- --host 0.0.0.0

volumes:
  postgres_data:
